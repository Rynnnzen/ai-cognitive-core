[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_cognitive_core"
version = "0.5.1"
description = "17-Layer Cognitive Architecture (Heart + Conscious + Memory) with Time-Based Energy & Texting Micro-Cues"
license = {file = "LICENSE"}
readme = "PATCH_NOTES.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "mcp<2",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.22.0",
    "google-auth-oauthlib>=1.0.0",
    "PySocks>=1.7.1",
]

[project.scripts]
ai-cognitive-mcp = "ai_cognitive_core.mcp_server:main"
ai-cognitive-auth = "ai_cognitive_core.drive_bridge:cli_oauth_login"
