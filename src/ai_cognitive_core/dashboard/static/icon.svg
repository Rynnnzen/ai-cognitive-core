<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Agent Memory Dashboard icon: a chunky crayon drawing a heart -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#FFFDF7" stroke="#3B3129" stroke-width="5"/>
  <!-- crayon body -->
  <g transform="rotate(-38 64 72)">
    <rect x="52" y="34" width="24" height="56" rx="6" fill="#FF6B9D" stroke="#3B3129" stroke-width="4"/>
    <rect x="52" y="34" width="24" height="14" rx="6" fill="#F5B90D" stroke="#3B3129" stroke-width="4"/>
    <path d="M52 90 L64 112 L76 90 Z" fill="#22B8CF" stroke="#3B3129" stroke-width="4" stroke-linejoin="round"/>
    <rect x="58" y="54" width="12" height="4" rx="2" fill="#FFFDF7"/>
    <rect x="58" y="64" width="12" height="4" rx="2" fill="#FFFDF7"/>
  </g>
  <!-- heart drawn by the crayon -->
  <path d="M84 96 C84 88 74 84 68 90 C62 84 52 88 52 96 C52 104 68 112 68 112 C68 112 84 104 84 96 Z"
        fill="#FF6B9D" stroke="#3B3129" stroke-width="4" stroke-linejoin="round"/>
  <!-- crayon dots -->
  <circle cx="34" cy="30" r="5" fill="#22B8CF" stroke="#3B3129" stroke-width="3"/>
  <circle cx="96" cy="34" r="5" fill="#34C77B" stroke="#3B3129" stroke-width="3"/>
  <circle cx="30" cy="96" r="5" fill="#A78BFA" stroke="#3B3129" stroke-width="3"/>
</svg>
